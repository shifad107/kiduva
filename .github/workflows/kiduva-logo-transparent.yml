name: Generate official transparent KIDUVA logo
on:
  push:
    paths:
      - 'scripts/make_transparent_logo.py'
      - '.github/workflows/kiduva-logo-transparent.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing requirements
        run: python -m pip install --quiet pillow numpy opencv-python-headless
      - name: Generate exact transparent logo and update website image references
        run: python scripts/make_transparent_logo.py
      - name: Commit transparent logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kiduva-logo-transparent.png src/App.tsx src/styles.css
          git diff --cached --quiet || git commit -m "Use transparent official KIDUVA logo throughout site"
          git push
